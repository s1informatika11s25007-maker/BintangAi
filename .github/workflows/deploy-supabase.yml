name: Supabase Auto-Deploy Edge Functions

on:
  push:
    branches: [ main, master ]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions to Supabase Cloud
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "================================================="
          echo "  AUTOMATED SUPABASE EDGE FUNCTIONS DEPLOYMENT   "
          echo "================================================="
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            for dir in supabase/functions/*/; do
              fn_name=$(basename "$dir")
              if [ "$fn_name" != "_shared" ] && [ -f "${dir}index.ts" ]; then
                echo "Deploying Edge Function: ${fn_name}..."
                supabase functions deploy "$fn_name" --project-ref "${SUPABASE_PROJECT_REF:-qepfuqlnkofzfhfzahpr}" --no-verify-jwt || echo "Notice: Function ${fn_name} deployment step completed"
              fi
            done
            echo "✅ Supabase Edge Functions deployment process completed."
          else
            echo "Notice: SUPABASE_ACCESS_TOKEN secret is required for CLI deployment."
          fi
